name: Go baseline CI

on:
  push:
    branches: [main, master, develop, "codex/**"]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          check-latest: true
          cache: true
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Verify immutable baseline
        run: python scripts/ci/verify_baseline.py
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: Download modules
        run: go mod download
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build API
        run: go build ./cmd/api